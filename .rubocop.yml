# Want to disable a check for a specific case? To disable checks inline:
# http://docs.rubocop.org/en/latest/configuration/#disabling-cops-within-source-code

# Begin with the 37signals house style (same baseline as bc3)
inherit_gem: { rubocop-37signals: rubocop.yml }

AllCops:
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

# This is a plain Ruby gem, not a Rails app. The house style bundles
# rubocop-rails (bc3 is Rails); its cops assume ActiveSupport extensions
# like assert_not / assert_not_nil that don't exist under plain Minitest.
Rails:
  Enabled: false

Rails/RefuteMethods:
  Enabled: false
